name: CI - Lint & Build (SIPMAS)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Job 1: Frontend & Backend Lint and Build (Monorepo)
    monorepo-lint-and-build:
    runs-on: ubuntu-latest
    name: Lint & Build (Frontend & Backend)
    env:
      DATABASE_URL: mysql://build:build@localhost:3306/build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.3.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate
        env:
          DATABASE_URL: mysql://build:build@localhost:3306/build

      - name: Run Dependency Audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Run Lint
        run: pnpm lint

      - name: Run Build
        run: pnpm build

      - name: Run Backend Tests
        run: pnpm --filter backend test
        env:
          JWT_SECRET: ci-test-jwt-secret-key-for-sipmas

  # Job 2: NLP Microservice Test & Train Verification
  nlp-service-ci:
    runs-on: ubuntu-latest
    name: NLP Service Verification & Training
    defaults:
      run:
        working-directory: apps/nlp-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/nlp-service/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Model Training CLI
        run: python -m app.model.train

      - name: Run NLP Pytest Suite
        run: pytest -v tests/

      - name: Verify Serving Application Import
        run: python -c "from app.main import app; print('Flask App initialized successfully')"

  # Job 3: Docker Build Verification
  docker-build-check:
    runs-on: ubuntu-latest
    name: Docker Build Validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NLP Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/nlp-service
          file: ./apps/nlp-service/Dockerfile
          push: false
          tags: sipmas-nlp:test

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: sipmas-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: false
          tags: sipmas-frontend:test